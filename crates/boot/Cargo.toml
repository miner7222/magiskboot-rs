[package]
name = "magiskboot"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "magiskboot"
path = "src/main.rs"

[build-dependencies]
pb-rs = { version = "0.10", default-features = false }

[dependencies]
base = { path = "../base" }
# Boot-image pipeline is pure Rust — no C++ linkage required.
# Compression
flate2 = { version = "1", features = ["zlib-rs"] }
bzip2 = "0.6"
lz4 = "1"
lzma-rust2 = "0.25"
# Crypto (RustCrypto crates are tied together; versions follow Magisk v31.0)
sha1 = "0.11"
sha2 = "0.11"
digest = "0.11"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
x509-cert = "0.3"
der = { version = "0.8", features = ["derive", "pem"] }
# Parsing
fdt = "0.1.5"
size = "0.5.0"
quick-protobuf = "0.8"
byteorder = "1"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
num-traits = "0.2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
